<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RimTown 事件追蹤板（離線原型）</title>
<style>
:root { --bg:#0f1318; --panel:#171d25; --panel2:#1e2631; --line:#2b3644; --text:#e6ebf2; --dim:#9aa7b8; --accent:#f0b35a; --ok:#6fcf97; --bad:#ef7d7d; --info:#74b3f0; --warn:#f2c94c; --violet:#b79cf5; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.6 system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; }
button { font:inherit; color:inherit; background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:8px 12px; min-height:44px; cursor:pointer; }
button:hover { border-color:var(--accent); } button.on { background:#3a2c14; border-color:var(--accent); color:var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
select { font:inherit; color:inherit; background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:8px; min-height:44px; max-width:100%; }
header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; }
header h1 { font-size:18px; margin:0; } .sub { color:var(--dim); font-size:13px; }
.badge { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; border:1px solid var(--line); color:var(--dim); white-space:nowrap; }
.badge.real { color:var(--ok); border-color:#2f6b4a; } .badge.staged { color:var(--info); border-color:#2d5d8a; } .badge.demo { color:#111; background:var(--warn); border-color:var(--warn); font-weight:700; }
.badge.open { color:var(--accent); border-color:#7a5a22; } .badge.closed { color:var(--dim); }
.wrap { display:grid; grid-template-columns:330px 1fr; gap:0; min-height:calc(100vh - 70px); }
.list { border-right:1px solid var(--line); padding:12px; overflow:auto; max-height:calc(100vh - 70px); }
.filters { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; } .filters button { min-height:36px; padding:4px 10px; font-size:13px; }
.card { display:block; width:100%; text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
.card.sel { border-color:var(--accent); background:#221c12; } .card .t { font-weight:600; } .card .m { color:var(--dim); font-size:13px; }
main { padding:16px; overflow:auto; max-height:calc(100vh - 70px); }
section { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:14px; }
section h2 { font-size:15px; margin:0 0 10px; color:var(--accent); } h3 { font-size:14px; margin:12px 0 6px; }
.kv { display:grid; grid-template-columns:110px 1fr; gap:4px 12px; } .kv dt { color:var(--dim); } .kv dd { margin:0; }
.steps { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:8px; } .step { padding:3px 10px; border-radius:99px; border:1px solid var(--line); color:var(--dim); font-size:13px; }
.step.done { color:var(--text); border-color:#557; background:#232a3a; } .step.cur { color:#111; background:var(--accent); border-color:var(--accent); font-weight:700; } .step.skip { text-decoration:line-through; opacity:.55; }
table { width:100%; border-collapse:collapse; font-size:14px; } th, td { text-align:left; vertical-align:top; padding:6px 8px; border-bottom:1px solid var(--line); } th { color:var(--dim); font-weight:500; white-space:nowrap; }
.tablewrap { overflow-x:auto; } td .none { color:var(--dim); }
.who { color:var(--info); cursor:pointer; text-decoration:underline; text-underline-offset:3px; background:none; border:0; padding:0; min-height:0; font:inherit; } .who.follow { color:var(--accent); font-weight:700; }
.tl { list-style:none; margin:0; padding:0; } .tl li { display:grid; grid-template-columns:92px 1fr; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line); } .tl li.hl { background:#221c12; }
.tl .when { color:var(--dim); font-size:13px; } .chip { display:inline-block; font-size:12px; padding:0 7px; border-radius:6px; margin-right:6px; border:1px solid var(--line); color:var(--dim); }
.chip.cause { color:var(--bad); } .chip.answer { color:var(--info); } .chip.outcome { color:var(--ok); } .chip.conflict { color:var(--bad); border-color:#7a3a3a; } .chip.strike { color:var(--warn); } .chip.exit { color:var(--violet); } .chip.hidden { color:#111; background:var(--violet); border-color:var(--violet); } .chip.scene { color:var(--accent); }
.why { color:var(--dim); font-size:13px; margin-top:2px; } .why b { color:var(--text); font-weight:500; } .src { font-size:12px; color:var(--dim); cursor:pointer; background:none; border:0; padding:0; min-height:0; text-decoration:underline dotted; }
pre.raw { background:#0b0e12; border:1px solid var(--line); border-radius:8px; padding:8px; font-size:12px; overflow:auto; white-space:pre-wrap; word-break:break-all; margin:6px 0 0; }
.note { color:var(--dim); font-size:13px; border-left:3px solid var(--line); padding-left:10px; margin:6px 0; } .warnbox { border:1px solid var(--warn); color:var(--warn); border-radius:10px; padding:8px 12px; margin-bottom:12px; }
canvas { width:100%; max-width:760px; height:auto; background:#0b0e12; border:1px solid var(--line); border-radius:10px; display:block; }
.scenebar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:8px 0; } input[type=range] { flex:1; min-width:160px; min-height:44px; }
.legend { display:flex; flex-wrap:wrap; gap:10px; font-size:13px; color:var(--dim); } .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; vertical-align:middle; }
.back { display:none; }
@media (max-width: 860px) { .wrap { grid-template-columns:1fr; } .list, main { max-height:none; } body.detail .list { display:none; } body:not(.detail) main { display:none; } .back { display:inline-block; margin-bottom:10px; } .kv { grid-template-columns:86px 1fr; } .tl li { grid-template-columns:1fr; gap:2px; } }
</style>
</head>
<body>
<header>
  <h1>事件追蹤板 <span class="sub">離線原型</span></h1>
  <label class="sub">資料來源 <select id="ds" aria-label="資料來源"></select></label>
  <span id="dsBadge"></span><span class="sub" id="dsInfo"></span>
</header>
<div class="wrap">
  <nav class="list" aria-label="事件清單"><div class="filters" id="filters"></div><div id="threads"></div></nav>
  <main id="main" aria-live="polite"></main>
</div>
<script src="data/manifest.js"></script>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const TYPE = { wage: ['💰', '工資爭議'], union: ['✊', '工會組織'], protest: ['📢', '抗議集合'], fight: ['👊', '打架'], guard: ['👮', '守衛'] };
const STAGES = { wage: [['grievance', '工資被壓'], ['organizing', '有人出面'], ['demand', '提出要求'], ['strike', '罷工'], ['ended', '結束']], protest: [['calling', '號召'], ['answers', '各人回答'], ['gathering', '集合'], ['ended', '結束']], union: [['considering', '有人考慮'], ['active', '運作中'], ['ended', '結束']] };
const OUT = { deal: '談成了，沒有罷工', strike_won: '罷工後老闆讓步', strike_lost: '罷工失敗', stalled: '不了了之', refused: '被拒絕，工會的錢不夠罷工', recovered: '工資自己回來了，沒有人行動', raise_after_strike: '自發罷工後老闆讓步', strike_failed: '自發罷工後老闆沒有讓步', fizzled: '沒有成形（到的人不夠）', held: '集合辦完了', dissolved: '工會解散', founded: '工會成立', injury: '有人受傷', guard: '守衛處理' };
const KIND = { cause: '起因', organize: '組織', invite: '號召', answer: '個人決定', talk: '談判', strike: '罷工', exit: '退出', outcome: '結果', conflict: '衝突', hidden: '觀察者才看得到', scene: '現場', follow: '後續', related: '相關', resource: '資源' };
const ROLE = { boss: '老闆', leader: '工會領袖', member: '會員', worker: '工人', organizer: '發起人', owner: '被抗議的老闆', protester: '反對的人', supporter: '支持的人', fighter: '當事人', injured: '受傷的人', involved: '當事人', unlisted: '不在名單上' };
const WHY = { own: '本人說的理由（AI 回答）', option: '選項內建的理由（照個性推估時用的固定句子，不是本人說的）', none: '沒有紀錄理由' };
const SRC = { log: '遊戲日誌', decision: '決策紀錄', state: '讀到的狀態' };
const SRCKIND = { REAL_GAME_RECORD: ['real', '真實遊戲紀錄'], STAGED_SCENARIO: ['staged', '測試場景：起始條件是人為設定的，過程由真實程式跑出'], DEMO_HANDWRITTEN: ['demo', '展示資料：手寫的，不是遊戲跑出來的'] };
const GROUP = ['wage', 'union', 'protest'];
let DATA = [], D = null, T = null, filter = 'all', typeF = 'group', follow = null, frameI = 0, timer = null;

const hm = (t) => (String(t || '').match(/\d{1,2}:\d{2}$/) || [''])[0];
function when(e) { return `第 ${e.d} 天` + (hm(e.time) ? ' ' + hm(e.time) : ''); }
function load() {
  DATA = (window.RIMTOWN_EVENT_DATA || []).slice();
  const ds = $('#ds'); ds.innerHTML = DATA.map((d, i) => `<option value="${i}">${esc(d.meta.label || d.meta.town || '資料 ' + (i + 1))}</option>`).join('') || '<option>沒有資料</option>';
  ds.onchange = () => pick(+ds.value); if (DATA.length) pick(0); else $('#main').innerHTML = '<section><h2>沒有資料</h2><p>先用 <code>node scripts/watch_record.js record</code> 錄一段，或確認 data/manifest.js 列的檔案存在。</p></section>';
}
function pick(i) {
  D = DATA[i]; T = null; follow = null; const k = SRCKIND[D.source] || ['demo', D.source];
  $('#dsBadge').innerHTML = `<span class="badge ${k[0]}">${esc(k[1])}</span>`;
  $('#dsInfo').textContent = `${D.meta.town || ''}　第 ${D.meta.from?.d ?? '?'}～${D.meta.to?.d ?? '?'} 天　遊戲版本 ${D.meta.app || '?'}　${D.meta.ai ? 'AI 開' : 'AI 關（照個性推估）'}　共 ${D.threads.length} 件`;
  renderList(); const first = visible()[0]; if (first && window.innerWidth > 860) open(first.id); else { document.body.classList.remove('detail'); $('#main').innerHTML = ''; }
}
function visible() { return D.threads.filter(t => (filter === 'all' || t.status === filter) && (typeF === 'all' || (typeF === 'group' ? GROUP.includes(t.type) : t.type === typeF)) && (!follow || t.people.some(p => p.id === follow))).sort((a, b) => (b.status === 'open') - (a.status === 'open') || (b.timeline.at(-1)?.tick ?? b.opened.tick) - (a.timeline.at(-1)?.tick ?? a.opened.tick)); }
function renderList() {
  const types = [...new Set(D.threads.map(t => t.type))];
  $('#filters').innerHTML = [['all', '全部'], ['open', '進行中'], ['closed', '已結束']].map(([k, n]) => `<button data-f="${k}" class="${filter === k ? 'on' : ''}" aria-pressed="${filter === k}">${n}</button>`).join('') + `<button data-t="group" class="${typeF === 'group' ? 'on' : ''}">多人的事</button><button data-t="all" class="${typeF === 'all' ? 'on' : ''}">所有種類</button>` + types.map(k => `<button data-t="${k}" class="${typeF === k ? 'on' : ''}">${(TYPE[k] || ['', k])[0]} ${(TYPE[k] || ['', k])[1]}</button>`).join('') + (follow ? `<button data-unfollow="1" class="on">正在跟：${esc(nameOf(follow))} ✕</button>` : '');
  const L = visible(); $('#threads').innerHTML = L.map(t => { const last = t.timeline.at(-1); const ty = TYPE[t.type] || ['', t.type];
    return `<button class="card ${T && T.id === t.id ? 'sel' : ''}" data-id="${t.id}"><div class="t">${ty[0]} ${esc(t.title)}</div><div class="m"><span class="badge ${t.status}">${t.status === 'open' ? '進行中' : '已結束'}</span> 第 ${t.opened.d}${t.closed ? '～' + t.closed.d : ' 天起'} 天・${t.people.length} 人・${t.timeline.length} 筆</div><div class="m">${esc(t.outcome ? (OUT[t.outcome.code] || t.outcome.code) : stageName(t))}${last && t.status === 'open' ? '（最近更新：第 ' + (last.lastD ?? last.d) + ' 天）' : ''}</div></button>`; }).join('') || '<p class="sub">這個條件下沒有事件。</p>';
}
const stageName = (t) => ((STAGES[t.type] || []).find(s => s[0] === t.stage) || [0, t.stage || ''])[1];
const nameOf = (id) => { for (const t of D.threads) { const p = t.people.find(p => p.id === id); if (p) return p.name; } return id; };
function open(id) { T = D.threads.find(t => t.id === id); frameI = 0; stop(); document.body.classList.add('detail'); renderList(); renderMain(); $('#main').scrollTop = 0; }
function visited(t) { const v = new Set(); const kinds = new Set(t.timeline.map(e => e.kind)); if (t.type === 'wage') { v.add('grievance'); if (t.timeline.some(e => e.src?.kind === 'organize' && e.src.id === 'lead') || t.timeline.some(e => e.src?.kind === 'union' && e.src.id === 'join')) v.add('organizing'); if (kinds.has('talk')) v.add('demand'); if (kinds.has('strike')) v.add('strike'); } if (t.type === 'protest') { v.add('calling'); if (kinds.has('answer')) v.add('answers'); if (t.scene) v.add('gathering'); } if (t.type === 'union') { if (t.key.includes('pre') || kinds.has('answer')) v.add('considering'); if (!t.key.includes('pre')) v.add('active'); } if (t.status === 'closed') v.add('ended'); return v; }
function renderMain() {
  if (!T) { $('#main').innerHTML = ''; return; } const t = T; const ty = TYPE[t.type] || ['', t.type]; const v = visited(t); const st = STAGES[t.type];
  const steps = st ? `<div class="steps" aria-label="進度">${st.map(([k, n]) => `<span class="step ${t.stage === k || (k === 'answers' && t.stage === 'calling' && v.has('answers')) ? 'cur' : v.has(k) ? 'done' : t.status === 'closed' ? 'skip' : ''}" title="${v.has(k) ? '有紀錄' : t.status === 'closed' ? '這一步沒有發生' : '還沒到'}">${n}</span>`).join('<span class="sub">→</span>')}</div>` : '';
  const facts = t.facts ? Object.entries({ pay: '開始時工資比例', workers: '這一行的工人數', boss: '老闆', union: '當時有沒有工會', members: '會員數', fund: '基金（銀幣）', leader: '領袖', strikes: '發動過罷工', won: '爭取成功', lost: '失敗' }).filter(([k]) => t.facts[k] != null).map(([k, n]) => `${n}：${k === 'pay' ? t.facts[k] + '%' : t.facts[k] === true ? '有' : t.facts[k] === false ? '沒有' : esc(t.facts[k])}`).join('　') : '';
  let h = `<button class="back" data-back="1">← 回事件清單</button>`;
  if (D.source !== 'REAL_GAME_RECORD') h += `<div class="warnbox">${esc((SRCKIND[D.source] || ['', D.source])[1])}</div>`;
  h += `<section><h2>${ty[0]} ${esc(t.title)}</h2><dl class="kv">
    <dt>種類</dt><dd>${esc(ty[1])} <span class="badge ${t.status}">${t.status === 'open' ? '進行中' : '已結束'}</span></dd>
    <dt>在哪裡</dt><dd>${esc(t.place?.name || '沒有地點')}${t.place?.id ? ` <button class="src" data-locate="1">在地圖上標出來</button>` : ''}<div class="note">${esc(t.place?.note || '')}</div></dd>
    <dt>時間</dt><dd>第 ${t.opened.d} 天開始${t.closed ? '，第 ' + t.closed.d + ' 天結束' : '，還沒結束'}</dd>
    <dt>進行到哪</dt><dd>${esc(stageName(t))}${steps}</dd>
    <dt>結果</dt><dd>${t.outcome ? `<b>${esc(OUT[t.outcome.code] || t.outcome.code)}</b><div class="why">${esc(t.outcome.text)}</div>` : '<span class="sub">還沒有結果</span>'}</dd>
    ${facts ? `<dt>當時的數字</dt><dd class="sub">${facts}</dd>` : ''}</dl></section>`;
  // 參與者
  const cell = (arr, f) => arr.length ? arr.map(f).join('<br>') : '<span class="none">沒有紀錄</span>';
  const tally = (f) => { const m = {}; for (const p of t.people) for (const k of f(p)) m[k] = (m[k] || 0) + 1; return Object.entries(m).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${esc(k)} ${n} 人`).join('、') || '沒有紀錄'; };
  const sum = `<p class="sub">共 ${t.people.length} 人。被問到：${t.people.filter(p => p.asked.length).length} 人。最後的回答：${tally(p => p.answered.length ? [p.answered.at(-1).text] : [])}。實際行動：${tally(p => [...new Set(p.acted.map(a => a.text.replace(/（.*?）/g, '')))])}。</p>`;
  h += `<section><h2>參與的人（被問到、回答、實際行動、結果分開記）</h2>${sum}<div class="tablewrap"><table><thead><tr><th>人</th><th>身分</th><th>被問到</th><th>回答</th><th>實際行動</th><th>結果</th></tr></thead><tbody>` + t.people.map(p => `<tr>
    <td><button class="who ${follow === p.id ? 'follow' : ''}" data-who="${esc(p.id)}">${esc(p.name)}</button></td><td>${esc(p.roles.map(r => ROLE[r] || r).join('、'))}</td>
    <td>${cell(p.asked, a => `第 ${a.d} 天：${esc(a.text)}`)}</td>
    <td>${cell(p.answered, a => `第 ${a.d} 天：${esc(a.text)}${a.why ? `<div class="why">理由：${esc(a.why)}<br><span title="${esc(WHY[a.whySrc])}">（${a.whySrc === 'own' ? '本人說的' : a.whySrc === 'option' ? '選項內建，不是本人說的' : '沒有紀錄'}）</span></div>` : ''}`)}</td>
    <td>${cell(p.acted, a => `第 ${a.from ?? a.d}${a.to != null && a.to !== a.from ? '～' + a.to : ''} 天：${esc(a.text)}`)}</td>
    <td>${cell(p.result, a => `第 ${a.d} 天：${esc(a.text)}`)}</td></tr>`).join('') + `</tbody></table></div>
    <p class="note">「回答」是他當時選的，「實際行動」是之後從遊戲狀態讀到的。兩欄對不上的地方就是答應了沒做，或沒被問就被算進去。點名字可以只看這個人。</p></section>`;
  // 現場
  h += `<section><h2>現場</h2>${sceneHtml(t)}</section>`;
  // 時間線
  // 同一天、同一個問題、同一個回答的人合併成一列（原始紀錄都還在，點開看名單）
  const rows = []; t.timeline.forEach((e, i) => { const g = e.src?.type === 'decision' ? e.d + '|' + e.kind + '|' + e.src.kind + '|' + e.src.id + '|' + (e.why || '') : null; const last = rows.at(-1); if (g && last && last.g === g) last.items.push([e, i]); else rows.push({ g, items: [[e, i]] }); });
  const one = (e, i) => `<li class="${follow && (e.who || []).includes(follow) ? 'hl' : ''}"><div class="when">${when(e)}${e.times > 1 ? `<br>同樣的回答共 ${e.times} 次，最後一次第 ${e.lastD} 天` : ''}</div><div>
    <span class="chip ${e.kind}">${esc(KIND[e.kind] || e.kind)}</span>${esc(e.text)}${e.uncertain ? ' <span class="badge" title="這筆日誌沒寫是哪一行，是從同一天的紀錄對出來的">對應不確定</span>' : ''}
    ${e.why || e.whySrc ? `<div class="why">理由：<b>${esc(e.why || '（沒有）')}</b>　來源：${esc(WHY[e.whySrc] || '')}</div>` : ''}${e.res ? `<div class="why">當下的結果：<b>${esc(e.res)}</b></div>` : ''}${e.note ? `<div class="note">${esc(e.note)}</div>` : ''}
    <button class="src" data-src="${i}" aria-expanded="false">來源：${esc(SRC[e.src?.type] || '未知')}${e.src?.mode ? (e.src.mode === 'ai' ? '（AI）' : '（照個性推估）') : ''}</button><pre class="raw" id="raw${i}" hidden>${esc(JSON.stringify(e.src, null, 1))}</pre></div></li>`;
  h += `<section><h2>時間線（每一筆都有來源）</h2><ul class="tl">` + rows.map(r => { if (r.items.length < 3) return r.items.map(([e, i]) => one(e, i)).join(''); const [e, i] = r.items[0]; const names = r.items.map(([x]) => x.text.split('：')[0]); const act = e.text.split('：').slice(1).join('：'); const mine = follow && r.items.some(([x]) => (x.who || []).includes(follow));
    return `<li class="${mine ? 'hl' : ''}"><div class="when">${when(e)}</div><div><span class="chip ${e.kind}">${esc(KIND[e.kind] || e.kind)}</span><b>${r.items.length} 個人</b>都回答：${esc(act)}
      <div class="why">理由：<b>${esc(e.why || '（沒有）')}</b>　來源：${esc(WHY[e.whySrc] || '')}${e.whySrc === 'option' ? '。這麼多人理由一字不差，是因為這句話是選項附帶的，不是各自說的。' : ''}</div>
      <button class="src" data-src="g${i}" aria-expanded="false">看這 ${r.items.length} 個人是誰</button><pre class="raw" id="rawg${i}" hidden>${esc(names.join('、'))}</pre></div></li>`; }).join('') + `</ul>${t.timeline.length ? '' : '<p class="sub">沒有紀錄。</p>'}</section>`;
  h += `<section><h2>錢與制度的變化</h2>${t.resources.length ? '<ul>' + t.resources.map(r => `<li>第 ${r.d} 天：${esc(r.text)}${r.note ? ` <span class="sub">（${esc(r.note)}）</span>` : ''} <span class="sub">來源：${esc(SRC[r.src?.type] || '')} ${esc(r.src?.path || '')}</span></li>`).join('') + '</ul>' : '<p class="sub">沒有讀到變化。</p>'}</section>`;
  h += `<section><h2>還沒了結的事</h2>${t.open.length ? '<ul>' + t.open.map(o => `<li>${esc(o.text)} <span class="sub">（第 ${o.since.d} 天起${o.until != null ? '，到第 ' + o.until + ' 天' : ''}）</span></li>`).join('') + '</ul>' : `<p class="sub">${t.status === 'open' ? '目前沒有等著發生的事。' : '沒有。'}</p>`}</section>`;
  $('#main').innerHTML = h; drawScene();
}
function sceneHtml(t) {
  if (!t.scene) return `<p>${esc(t.place?.note || '這件事沒有現場。')}</p>${t.place?.id ? '<canvas id="cv" width="760" height="460" aria-label="小鎮地圖"></canvas><p class="sub">地圖只標出地點，沒有人物位置的紀錄。</p>' : '<p class="sub">所以這裡只有時間線，沒有地圖畫面。</p>'}`;
  const S = t.scene; return `<p>以下是真的被排去現場的 ${S.who.length} 個人，在每個時間點的位置（讀自遊戲狀態，有變化才記一格，共 ${S.frames.length} 格）。沒到場的人不會出現。</p>
    <div class="scenebar"><button data-play="1" id="playBtn">▶ 重看</button><input type="range" id="fr" min="0" max="${Math.max(0, S.frames.length - 1)}" value="${frameI}" aria-label="時間"><span id="frLabel" class="sub"></span></div>
    <canvas id="cv" width="760" height="460" aria-label="現場地圖"></canvas>
    <div class="legend"><span><i class="dot" style="background:#ef7d7d"></i>反對的人</span><span><i class="dot" style="background:#6fcf97"></i>支持的人</span><span><i class="dot" style="background:#9aa7b8"></i>不知道哪一邊</span><span>實心＝人在現場</span><span>空心＝還在路上或在別處</span><span>✕＝已經離開</span>${follow ? `<span><i class="dot" style="background:#f0b35a"></i>正在跟的人</span>` : ''}</div><div id="frList" class="sub"></div>`;
}
function drawScene() {
  const cv = $('#cv'); if (!cv || !T) return; const g = cv.getContext('2d'); const W = cv.width, H = cv.height; g.clearRect(0, 0, W, H);
  const M = D.map.filter(l => l.x != null && l.y != null); if (!M.length) { g.fillStyle = '#9aa7b8'; g.fillText('這份資料沒有地圖座標', 20, 30); return; }
  const xs = M.map(l => l.x), ys = M.map(l => l.y); const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys); const pad = 60;
  const X = (x) => pad + (x - x0) / Math.max(1, x1 - x0) * (W - pad * 2), Y = (y) => pad + (y - y0) / Math.max(1, y1 - y0) * (H - pad * 2 - 40);
  const pos = {}; for (const l of M) pos[l.id] = [X(l.x), Y(l.y)];
  const place = T.place?.id; const base = place ? place.replace(/_front$/, '') : null; let pp = pos[place] || null; let known = !!pp;
  if (!pp && base && pos[base]) { pp = [pos[base][0], pos[base][1] + 26]; known = true; } if (!pp && place) pp = [W - 90, H - 50];
  g.font = '12px system-ui,sans-serif'; g.textAlign = 'center';
  for (const l of M) { const [x, y] = pos[l.id]; g.fillStyle = '#2b3644'; g.beginPath(); g.arc(x, y, 7, 0, 7); g.fill(); g.fillStyle = '#9aa7b8'; g.fillText(l.name, x, y - 12); }
  if (pp) { g.strokeStyle = '#f0b35a'; g.lineWidth = 2; g.beginPath(); g.arc(pp[0], pp[1], 30, 0, 7); g.stroke(); g.fillStyle = '#f0b35a'; g.fillText((T.place.name || place) + (known ? '' : '（地圖上沒有這個點的座標）'), Math.min(W - 150, Math.max(150, pp[0])), pp[1] + 46); }
  const S = T.scene; if (!S || !S.frames.length) return; const F = S.frames[Math.min(frameI, S.frames.length - 1)]; const at = {}; const lines = [];
  for (const id of S.who) { const p = F.pos[id]; if (!p) continue; (at[p.loc] = at[p.loc] || []).push([id, p]); }
  for (const [loc, arr] of Object.entries(at)) { const c = loc === place ? pp : pos[loc] || (pos[String(loc).replace(/_front$/, '')]) || [70, H - 30]; arr.forEach(([id, p], i) => { const a = i / Math.max(1, arr.length) * Math.PI * 2, r = loc === place ? 16 : 14; const x = c[0] + Math.cos(a) * r * (arr.length > 1 ? 1 : 0), y = c[1] + Math.sin(a) * r * (arr.length > 1 ? 1 : 0);
    const col = id === follow ? '#f0b35a' : S.sides[id] === 'pro' ? '#6fcf97' : S.sides[id] === 'con' ? '#ef7d7d' : '#9aa7b8'; g.strokeStyle = col; g.fillStyle = col; g.lineWidth = 2; g.beginPath(); g.arc(x, y, id === follow ? 7 : 5, 0, 7); if (p.st === 'present') g.fill(); else g.stroke(); if (p.st === 'left') { g.fillText('✕', x, y + 4); } }); }
  for (const id of S.who) { const p = F.pos[id]; if (p) lines.push(`${nameOf(id)}：${{ present: '在現場', heading: '往現場走', waiting: '還沒出發', left: '已離開' }[p.st] || p.st}（${locName(p.loc)}）`); }
  const lab = $('#frLabel'); if (lab) lab.textContent = `第 ${F.d} 天 ${hm(F.time)}（${frameI + 1}/${S.frames.length}）`; const fl = $('#frList'); if (fl) fl.textContent = lines.join('　');
}
const locName = (id) => (D.map.find(l => l.id === id)?.name) || (T?.place?.id === id ? T.place.name : id || '不明');
function stop() { if (timer) { clearInterval(timer); timer = null; } const b = $('#playBtn'); if (b) b.textContent = '▶ 重看'; }
function personHtml(id) {
  const rows = []; for (const t of D.threads) { const p = t.people.find(p => p.id === id); if (!p) continue; for (const [col, arr] of [['被問到', p.asked], ['回答', p.answered], ['實際行動', p.acted], ['結果', p.result]]) for (const a of arr) rows.push({ d: a.from ?? a.d, col, text: a.text, why: a.why, whySrc: a.whySrc, t }); }
  rows.sort((a, b) => a.d - b.d);
  return `<section><h2>只看 ${esc(nameOf(id))}：跨事件的先後順序</h2><p class="note">照時間排。前後回答不一樣時，這裡看得出先後；理由只列紀錄裡有的，沒有就寫沒有。同一天發生的事不代表有因果。</p><div class="tablewrap"><table><thead><tr><th>哪一天</th><th>哪件事</th><th>哪一欄</th><th>內容</th></tr></thead><tbody>${rows.map(r => `<tr><td>第 ${r.d} 天</td><td><button class="who" data-open="${r.t.id}">${esc(r.t.title)}</button></td><td>${r.col}</td><td>${esc(r.text)}${r.why ? `<div class="why">理由：${esc(r.why)}（${r.whySrc === 'own' ? '本人說的' : '選項內建，不是本人說的'}）</div>` : ''}</td></tr>`).join('')}</tbody></table></div></section>`;
}
document.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return; const d = b.dataset;
  if (d.f) { filter = d.f; renderList(); } else if (d.t) { typeF = d.t; renderList(); } else if (d.unfollow) { follow = null; renderList(); renderMain(); }
  else if (d.id) open(d.id); else if (d.open) open(d.open); else if (d.back) { document.body.classList.remove('detail'); stop(); }
  else if (d.who) { follow = follow === d.who ? null : d.who; renderList(); renderMain(); if (follow) { $('#main').insertAdjacentHTML('afterbegin', personHtml(follow)); $('#main').scrollTop = 0; } }
  else if (d.src != null) { const p = $('#raw' + d.src); p.hidden = !p.hidden; b.setAttribute('aria-expanded', String(!p.hidden)); }
  else if (d.locate) { $('#cv')?.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  else if (d.play) { if (timer) return stop(); const S = T.scene; if (!S) return; if (frameI >= S.frames.length - 1) frameI = 0; b.textContent = '⏸ 暫停'; timer = setInterval(() => { if (frameI >= S.frames.length - 1) return stop(); frameI++; $('#fr').value = frameI; drawScene(); }, 700); }
});
document.addEventListener('input', (ev) => { if (ev.target.id === 'fr') { frameI = +ev.target.value; drawScene(); } });
(function boot() { const files = window.RIMTOWN_EVENT_FILES || []; let left = files.length; if (!left) return load(); for (const f of files) { const s = document.createElement('script'); s.async = false; s.src = 'data/' + f; s.onload = s.onerror = () => { if (--left === 0) load(); }; document.head.appendChild(s); } })();
</script>
