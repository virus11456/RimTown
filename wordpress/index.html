<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邊境鎮 - AI 小鎮模擬</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="rimtown-app" class="rimtown-container">
    <!-- Town Manager Modal -->
    <div id="town-modal" class="modal hidden">
        <div class="modal-content town-content">
            <h2>🏘️ <span data-i18n="城鎮列表">城鎮列表</span></h2>
            <div id="town-list-content">
                <!-- Rendered dynamically -->
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <h2 data-i18n="設定">設定</h2>
            <div class="setting-group">
                <label data-i18n="AI 語言模型">AI 語言模型</label>
                <select id="llm-provider">
                    <option value="none" data-i18n="無（模擬對話）">無（模擬對話）</option>
                    <option value="anthropic">Anthropic (Claude)</option>
                    <option value="openai">OpenAI (GPT)</option>
                    <option value="gemini">Google (Gemini)</option>
                    <option value="deepseek">DeepSeek</option>
                    <option value="groq">Groq</option>
                    <option value="together">Together AI</option>
                    <option value="minimax" data-i18n="MiniMax (海螺AI)">MiniMax (海螺AI)</option>
                </select>
            </div>
            <div class="setting-group" id="api-key-group">
                <label data-i18n="API 金鑰">API 金鑰</label>
                <input type="password" id="llm-api-key" data-i18n-placeholder="輸入你的 API 金鑰..." placeholder="輸入你的 API 金鑰...">
            </div>
            <div class="setting-group">
                <label><span data-i18n="備用 Groq API Key">備用 Groq API Key</span> <span style="font-size:11px;color:var(--text-secondary)" data-i18n="主 AI 超限時自動切換">（主 AI 超限時自動切換）</span></label>
                <input type="password" id="fallback-groq-key" placeholder="gsk_...">
            </div>
            <div class="setting-group">
                <label data-i18n="模擬速度">模擬速度</label>
                <select id="sim-speed">
                    <option value="3000" data-i18n="慢速（3秒）">慢速（3秒）</option>
                    <option value="2000" selected data-i18n="正常（2秒）">正常（2秒）</option>
                    <option value="1000" data-i18n="快速（1秒）">快速（1秒）</option>
                    <option value="500" data-i18n="極快（0.5秒）">極快（0.5秒）</option>
                </select>
            </div>
            <div class="setting-group">
                <label data-i18n="語言">語言</label>
                <select id="lang-select">
                    <option value="zh">繁體中文</option>
                    <option value="en">English</option>
                </select>
            </div>
            <div class="modal-buttons">
                <button id="settings-save" class="btn-accent" data-i18n="儲存">儲存</button>
                <button id="settings-cancel" data-i18n="取消">取消</button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <div class="header">
        <h1 data-i18n="邊境鎮">邊境鎮</h1>
        <div class="header-info">
            <span id="population-count">人口：--</span>
            <span id="clock-display" class="clock-display" data-i18n="載入中...">載入中...</span>
            <span id="terrain-display" class="terrain-display"></span>
            <div class="controls">
                <button class="btn-towns" data-action="show-towns" data-i18n="城鎮列表">城鎮列表</button>
                <button id="btn-new-game" class="btn-new-game" data-i18n="新地圖">新地圖</button>
                <button id="btn-save" class="btn-save" data-i18n="儲存">儲存</button>
                <button id="btn-export" class="btn-export" data-i18n="匯出" data-i18n-title="匯出存檔" title="匯出存檔">匯出</button>
                <button id="btn-import" class="btn-import" data-i18n="匯入" data-i18n-title="匯入存檔" title="匯入存檔">匯入</button>
                <button id="btn-pause" data-i18n="暫停">暫停</button>
                <button id="btn-resume" class="active" data-i18n="播放">播放</button>
                <div class="speed-controls">
                    <button class="btn-speed active" data-speed="1">1x</button>
                    <button class="btn-speed" data-speed="1.5">1.5x</button>
                    <button class="btn-speed" data-speed="2">2x</button>
                    <button class="btn-speed" data-speed="3">3x</button>
                </div>
                <span id="llm-status" class="llm-status" data-i18n-title="AI 狀態" title="AI 狀態">AI:--</span>
                <button id="btn-settings" class="btn-settings" data-i18n="設定">設定</button>
                <span id="version-display" class="version-display"></span>
            </div>
        </div>
    </div>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Town Map -->
        <div class="map-panel">
            <canvas id="town-map-canvas"></canvas>
            <div class="town-map" id="town-map" style="display:none"></div>
        </div>

        <!-- Sidebar -->
        <div class="rt-sidebar">
            <div class="rt-sidebar-tabs">
                <button data-tab="residents" class="active"><span class="tab-icon">👥</span><span class="tab-label" data-i18n="居民">居民</span></button>
                <button data-tab="chat"><span class="tab-icon">💬</span><span class="tab-label" data-i18n="聊天">聊天</span></button>
                <button data-tab="detail"><span class="tab-icon">📋</span><span class="tab-label" data-i18n="詳情">詳情</span></button>
                <button data-tab="economy"><span class="tab-icon">💰</span><span class="tab-label" data-i18n="經濟">經濟</span></button>
                <button data-tab="industry"><span class="tab-icon">🏭</span><span class="tab-label" data-i18n="產業">產業</span></button>
                <button data-tab="quest"><span class="tab-icon">⚔️</span><span class="tab-label" data-i18n="任務">任務</span></button>
                <button data-tab="events"><span class="tab-icon">📰</span><span class="tab-label" data-i18n="事件">事件</span></button>
                <button data-tab="newspaper"><span class="tab-icon">🗞️</span><span class="tab-label" data-i18n="日報">日報</span></button>
                <button data-tab="log"><span class="tab-icon">📝</span><span class="tab-label" data-i18n="日誌">日誌</span></button>
            </div>
            <div class="rt-sidebar-content" id="sidebar-content">
                <!-- Content rendered dynamically -->
            </div>
        </div>
    </div>

    </div>

    <script src="i18n.js"></script>
    <script src="quest-system.js"></script>
    <script src="industry.js"></script>
    <script src="farm.js"></script>
    <script src="processing.js"></script>
    <script src="daily-news.js"></script>
    <script src="npc-events.js"></script>
    <script src="npc-quests.js"></script>
    <script src="custom-npc.js"></script>
    <script src="prosperity.js"></script>
    <script src="simulation.js"></script>
    <script src="tilemap.js"></script>
    <script src="app.js"></script>
</body>
</html>
