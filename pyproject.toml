[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rimtown"
version = "0.1.0"
description = "AI Town Simulation inspired by RimWorld"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "aiohttp>=3.9.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.39.0"]
openai = ["openai>=1.0.0"]
gemini = ["google-genai>=1.0.0"]
all = ["anthropic>=0.39.0", "openai>=1.0.0", "google-genai>=1.0.0"]

[project.scripts]
rimtown = "rimtown.main:entry"

[tool.setuptools.packages.find]
include = ["rimtown*"]

[tool.setuptools.package-data]
rimtown = ["config/*.yaml", "web/templates/*.html", "web/static/*"]
