<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RimTown - AI Town Simulation</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#e94560">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <!-- Header -->
    <div class="header">
        <h1>RIMTOWN</h1>
        <div class="header-info">
            <span id="population-count">Population: --</span>
            <span id="clock-display" class="clock-display">Loading...</span>
            <div class="controls">
                <button id="btn-pause">Pause</button>
                <button id="btn-resume" class="active">Play</button>
            </div>
        </div>
    </div>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Town Map -->
        <div class="map-panel">
            <div class="town-map" id="town-map">
                <!-- Locations and agents rendered dynamically -->
            </div>
        </div>

        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-tabs">
                <button data-tab="residents" class="active">Residents</button>
                <button data-tab="chat">Chat</button>
                <button data-tab="detail">Detail</button>
                <button data-tab="log">Log</button>
                <button data-tab="events">Events</button>
            </div>
            <div class="sidebar-content" id="sidebar-content">
                <!-- Content rendered dynamically -->
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js')
                .then(reg => console.log('SW registered'))
                .catch(err => console.log('SW registration failed:', err));
        }
    </script>
</body>
</html>
