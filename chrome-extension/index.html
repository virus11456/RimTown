<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="邊境鎮">
    <meta name="theme-color" content="#13111f">
    <meta name="description" content="邊境鎮 RimTown：AI 村民自己拿主意的 3D 小鎮沙盒，打開瀏覽器就能看。A browser 3D town where AI villagers make their own decisions.">
    <link rel="manifest" href="pwa-manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon32.png">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <title>邊境鎮 RimTown - AI 小鎮模擬</title>
    <link rel="canonical" href="https://rimtown.cc/">
    <style>
    /* 獨立版關鍵樣式:深色底 + 滿版鎖定,避免 Safari 上下留白/彈跳(style.css 載入前就生效) */
    html, body { background: #13111f; margin: 0; padding: 0; height: 100%; overscroll-behavior: none; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="landing.css">
</head>
<!-- v6.82.2 首頁(/):只放介紹與登入註冊,不載遊戲。遊戲在 /town(town.html),登入後才下載 -->
<body class="rimtown-page landing-open" style="background:#13111f;margin:0">
<div id="landing" class="landing hidden"></div>
<div class="rimtown-container" id="rt-auth-host" style="height:0 !important;min-height:0 !important;overflow:visible !important;display:block !important;background:none !important">
    <div id="auth-modal" class="modal hidden">
        <div class="modal-content login-content">
            <button class="auth-close-btn" style="position:absolute;top:8px;right:12px;background:none;border:none;color:var(--text-secondary);font-size:1.2rem;cursor:pointer">✕</button>
            <h2>👤 <span data-i18n="帳號">帳號</span></h2>
            <div style="display:flex;gap:0;margin-bottom:12px">
                <button class="auth-tab active" data-auth-tab="login" style="flex:1;padding:6px;background:var(--bg-secondary);border:1px solid var(--border);border-bottom:2px solid var(--accent);color:var(--text-primary);cursor:pointer;font-size:0.8rem" data-i18n="登入">登入</button>
                <button class="auth-tab" data-auth-tab="register" style="flex:1;padding:6px;background:var(--bg-secondary);border:1px solid var(--border);border-bottom:2px solid transparent;color:var(--text-secondary);cursor:pointer;font-size:0.8rem" data-i18n="註冊">註冊</button>
            </div>
            <div id="auth-login-form">
                <input type="text" id="auth-login-user" data-i18n-placeholder="帳號" placeholder="帳號" style="width:100%;padding:8px;margin-bottom:6px;background:var(--bg-primary);color:var(--text-primary);border:1px solid var(--border);border-radius:4px;box-sizing:border-box;font-size:0.85rem">
                <input type="password" id="auth-login-pass" data-i18n-placeholder="密碼" placeholder="密碼" style="width:100%;padding:8px;margin-bottom:6px;background:var(--bg-primary);color:var(--text-primary);border:1px solid var(--border);border-radius:4px;box-sizing:border-box;font-size:0.85rem">
                <div id="auth-login-error" class="login-error"></div>
                <button id="auth-login-btn" class="btn-accent" style="width:100%;padding:8px;border:none;border-radius:4px;cursor:pointer;font-size:0.85rem;margin-top:4px" data-i18n="登入">登入</button>
                <div style="margin-top:8px"><a href="#" id="auth-forgot-link" style="color:var(--text-secondary);font-size:0.75rem" data-i18n="忘記密碼？">忘記密碼？</a></div>
            </div>
            <div id="auth-register-form" class="hidden">
                <input type="text" id="auth-reg-user" data-i18n-placeholder="帳號" placeholder="帳號" style="width:100%;padding:8px;margin-bottom:6px;background:var(--bg-primary);color:var(--text-primary);border:1px solid var(--border);border-radius:4px;box-sizing:border-box;font-size:0.85rem">
                <input type="text" id="auth-reg-invite" data-i18n-placeholder="推薦碼（必填）" placeholder="推薦碼（必填）" autocapitalize="characters" style="width:100%;padding:8px;margin-bottom:6px;background:var(--bg-primary);color:var(--text-primary);border:1px solid var(--accent);border-radius:4px;box-sizing:border-box;font-size:0.85rem;letter-spacing:1px;text-transform:uppercase">
                <input type="email" id="auth-reg-email" placeholder="Email" style="width:100%;padding:8px;margin-bottom:6px;background:var(--bg-primary);color:var(--text-primary);border:1px solid var(--border);border-radius:4px;box-sizing:border-box;font-size:0.85rem">
                <input type="password" id="auth-reg-pass" data-i18n-placeholder="密碼" placeholder="密碼" style="width:100%;padding:8px;margin-bottom:6px;background:var(--bg-primary);color:var(--text-primary);border:1px solid var(--border);border-radius:4px;box-sizing:border-box;font-size:0.85rem">
                <input type="password" id="auth-reg-pass2" data-i18n-placeholder="確認密碼" placeholder="確認密碼" style="width:100%;padding:8px;margin-bottom:6px;background:var(--bg-primary);color:var(--text-primary);border:1px solid var(--border);border-radius:4px;box-sizing:border-box;font-size:0.85rem">
                <div id="auth-reg-error" class="login-error"></div>
                <button id="auth-reg-btn" class="btn-accent" style="width:100%;padding:8px;border:none;border-radius:4px;cursor:pointer;font-size:0.85rem;margin-top:4px" data-i18n="註冊">註冊</button>
            </div>
            <div id="auth-reset-form" class="hidden">
                <p style="font-size:0.75rem;color:var(--text-secondary);margin-bottom:8px" data-i18n="輸入帳號和 Email 來重設密碼">輸入帳號和 Email 來重設密碼</p>
                <input type="text" id="auth-reset-user" data-i18n-placeholder="帳號" placeholder="帳號" style="width:100%;padding:8px;margin-bottom:6px;background:var(--bg-primary);color:var(--text-primary);border:1px solid var(--border);border-radius:4px;box-sizing:border-box;font-size:0.85rem">
                <input type="email" id="auth-reset-email" placeholder="Email" style="width:100%;padding:8px;margin-bottom:6px;background:var(--bg-primary);color:var(--text-primary);border:1px solid var(--border);border-radius:4px;box-sizing:border-box;font-size:0.85rem">
                <input type="password" id="auth-reset-pass" data-i18n-placeholder="新密碼" placeholder="新密碼" style="width:100%;padding:8px;margin-bottom:6px;background:var(--bg-primary);color:var(--text-primary);border:1px solid var(--border);border-radius:4px;box-sizing:border-box;font-size:0.85rem">
                <input type="password" id="auth-reset-pass2" data-i18n-placeholder="確認新密碼" placeholder="確認新密碼" style="width:100%;padding:8px;margin-bottom:6px;background:var(--bg-primary);color:var(--text-primary);border:1px solid var(--border);border-radius:4px;box-sizing:border-box;font-size:0.85rem">
                <div id="auth-reset-error" class="login-error"></div>
                <div id="auth-reset-success" style="color:var(--positive);font-size:0.75rem;min-height:18px"></div>
                <button id="auth-reset-btn" class="btn-accent" style="width:100%;padding:8px;border:none;border-radius:4px;cursor:pointer;font-size:0.85rem;margin-top:4px" data-i18n="重設密碼">重設密碼</button>
                <div style="margin-top:8px"><a href="#" id="auth-reset-back" style="color:var(--text-secondary);font-size:0.75rem" data-i18n="← 返回登入">← 返回登入</a></div>
            </div>
        </div>
    </div>
</div>
    <script src="s2t.js"></script>
    <script src="i18n.js"></script>
    <script src="sim-agent.js"></script>
    <script src="app.js"></script>
    <script src="app-landing.js"></script>
    <script src="landing-page.js"></script>
    <script src="landing-3d.js"></script>
    <script>
    // v6.82.2 首頁開機:只借用 RimTownApp 的首頁與帳號方法,不建立世界、不跑模擬
    (function () {
        var local = /^(localhost|127\.|0\.0\.0\.0)/.test(location.hostname) || location.protocol === 'file:';
        var TOWN = local ? 'town.html' : 'town';
        window.RT_TOWN_URL = TOWN;
        var app = Object.create(RimTownApp.prototype);
        app.auth = new RimTownAuth();
        var enterNow = false; try { enterNow = sessionStorage.getItem('rimtown_enter_now') === '1'; } catch (e) {}
        if (app.auth.loggedIn && enterNow) { location.replace(TOWN); return; } // 剛登入/註冊完:直接進遊戲
        app.world = null; app._initReady = true; app._landingActive = true;
        app._landingMode = app.auth.loggedIn ? 'continue' : 'auth';
        if (typeof app._getTownList !== 'function') app._getTownList = function () { try { return JSON.parse(localStorage.getItem('rimtown_town_list') || '[]'); } catch (e) { return []; } };
        app._enterGame = function () { location.href = TOWN; };
        app._landingUpdateContinue = function () {
            var btns = document.querySelectorAll('#landing-continue, [data-lp-go="continue"]'); if (!btns.length) return;
            var last = ''; try { last = localStorage.getItem('rimtown_last_town') || ''; } catch (e) {}
            var meta = app._getTownList().filter(function (tw) { return tw.id === last; })[0];
            var name = meta && meta.name ? t(meta.name) : '';
            var b = document.getElementById('landing-continue');
            if (b) { b.disabled = false; b.innerHTML = t('繼續遊戲') + (name ? '<span class="landing-continue-sub">' + app._escapeHtml(name) + '</span>' : ''); }
        };
        window.rimtownLanding = app;
        var start = function () {
            app.setupAuthListeners(); app._renderLanding(); app._showLanding();
            if (I18N.getLang() !== 'zh') I18N.setLang(I18N.getLang());
            try { if ('requestIdleCallback' in window && app.auth.loggedIn) requestIdleCallback(function () { var l = document.createElement('link'); l.rel = 'prefetch'; l.href = 'vendor/three.min.js'; document.head.appendChild(l); }); } catch (e) {} // 已登入:閒置時先預抓最大的檔案
        };
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
    })();
    </script>
    <script>
    // PWA Service Worker Registration & Install Prompt
    (function() {
        if ('serviceWorker' in navigator) {
            // v6.39.1 新版 Service Worker 接管後:還在首頁就直接重新整理拿新版;已經在遊戲裡就只提示,不打斷進度
            const hadController = !!navigator.serviceWorker.controller;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!hadController || window.__rtSwReloaded) return;
                window.__rtSwReloaded = true;
                const app = window.rimtownApp;
                if (!app || !app.world) { location.reload(); return; }
                try { app._showCornerNotice?.({ icon: '🆕', title: (typeof t === 'function') ? t('有新版本') : 'Update ready', name: '', desc: (typeof t === 'function') ? t('重新整理頁面就會更新到最新版。') : 'Reload the page to get the latest version.' }); } catch (e) {}
            });
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        }
    })();
    </script>
</body>
</html>
